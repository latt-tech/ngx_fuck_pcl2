# Example configuration for ngx_fuck_pcl2.
#
# "ngx_fuck_pcl2 on;" may be placed in http{} or server{}.  Requests whose
# User-Agent contains "PCL" (case-insensitive) get a 444: the connection is
# closed without a single byte of response.

worker_processes  1;
error_log  logs/error.log info;      # info level logs each dropped client
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    access_log  logs/access.log;
    default_type text/plain;

    # enable it for every server below
    ngx_fuck_pcl2 on;

    server {
        listen       80;
        server_name  example.com;

        location / {
            return 200 "hello\n";
        }
    }

    # a server that only filters for a part of its tree: the check runs before
    # nginx selects a location, so the switch is per server, not per location
    server {
        listen       8080;
        server_name  other.example.com;

        ngx_fuck_pcl2 off;

        location / {
            return 200 "not filtered\n";
        }
    }
}
