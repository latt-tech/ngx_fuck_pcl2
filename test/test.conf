# Configuration used by run-tests.sh (two servers on loopback ports).
worker_processes  1;
error_log  logs/error.log info;
pid        logs/nginx.pid;

events {
    worker_connections  128;
}

http {
    access_log  logs/access.log;
    default_type text/plain;

    # enabled for every server, switched off again in the second one
    ngx_fuck_pcl2 on;

    server {
        listen       127.0.0.1:18081;
        server_name  filtered;
        location / { return 200 "filtered\n"; }
    }

    server {
        listen       127.0.0.1:18082;
        server_name  exempt;
        ngx_fuck_pcl2 off;
        location / { return 200 "exempt\n"; }
    }
}
